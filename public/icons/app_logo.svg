<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#431407" />
      <stop offset="50%" stop-color="#2a0e05" />
      <stop offset="100%" stop-color="#140502" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="30%" stop-color="#ea580c" />
      <stop offset="70%" stop-color="#c2410c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#c2410c" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#7c2d12" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with subtle golden-amber border -->
  <rect x="4" y="4" width="112" height="112" rx="26" fill="url(#bgGrad)" stroke="#ea580c" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Outer Astral subtle ring -->
  <circle cx="60" cy="60" r="48" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.4" />
  <circle cx="60" cy="60" r="32" fill="url(#starGlow)" />

  <!-- Tilted orbital ellipse with planetary nodes -->
  <g stroke="#ea580c" stroke-width="1.8" fill="none" opacity="0.9">
    <ellipse cx="60" cy="60" rx="42" ry="21" transform="rotate(-30 60 60)" />
    <path d="M 62 20 A 38 38 0 0 1 98 66" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Planetary node beads -->
  <circle cx="95" cy="44" r="2.8" fill="#fb923c" />
  <circle cx="92" cy="82" r="2.4" fill="#fb923c" />
  <circle cx="26" cy="74" r="1.8" fill="#fb923c" opacity="0.85" />

  <!-- 4-Point Astronava Celestial Navigation Star -->
  <path d="
    M 60 14
    C 60 41 41 60 14 60
    C 41 60 60 79 60 106
    C 60 79 79 60 106 60
    C 79 60 60 41 60 14 Z
  " fill="url(#starGrad)" stroke="#ffd7a8" stroke-width="0.8" filter="url(#glow)" />

  <!-- Central Navigational Core -->
  <circle cx="60" cy="60" r="8" fill="#ea580c" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="58" cy="58" r="2" fill="#ffffff" opacity="0.9" />
</svg>
