<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="astronavaStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#c2410c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
    <radialGradient id="astronavaCoreGrad" cx="45%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="70%" stop-color="#c2410c" />
      <stop offset="100%" stop-color="#7c2d12" />
    </radialGradient>
  </defs>

  <!-- Orbital ellipse 1 with planetary nodes -->
  <g stroke="#c2410c" stroke-width="1.6" fill="none" opacity="0.85">
    <!-- Tilted orbit -->
    <ellipse cx="48" cy="50" rx="34" ry="18" transform="rotate(-32 48 50)" />
    <!-- Tilted outer partial ring -->
    <path d="M 50 18 A 32 32 0 0 1 82 56" stroke-width="1.8" stroke-linecap="round" />
  </g>

  <!-- Planetary node dots on the orbit -->
  <circle cx="78" cy="36" r="2.4" fill="#c2410c" />
  <circle cx="76" cy="68" r="2" fill="#c2410c" />
  <circle cx="20" cy="58" r="1.5" fill="#c2410c" opacity="0.8" />

  <!-- 4-Point Celestial Navigation Star -->
  <!-- Top: (48, 12), Right: (88, 50), Bottom: (48, 88), Left: (8, 50) -->
  <path d="
    M 48 10
    C 48 34 32 50 8 50
    C 32 50 48 66 48 90
    C 48 66 64 50 88 50
    C 64 50 48 34 48 10 Z
  " fill="url(#astronavaStarGrad)" stroke="#7c2d12" stroke-width="0.8" />

  <!-- Central Navigational Celestial Core -->
  <circle cx="48" cy="50" r="6.2" fill="url(#astronavaCoreGrad)" stroke="#ffffff" stroke-width="1" />
  <circle cx="46.5" cy="48.5" r="1.5" fill="#fff" opacity="0.8" />
</svg>
