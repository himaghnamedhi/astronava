<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="100%" height="100%">
  <defs>
    <linearGradient id="astroFullStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#c2410c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
    <radialGradient id="astroFullCoreGrad" cx="45%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="70%" stop-color="#c2410c" />
      <stop offset="100%" stop-color="#7c2d12" />
    </radialGradient>
    <linearGradient id="goldStarInOGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="60%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&amp;family=Playfair+Display:wght@700;800&amp;display=swap');
      .astronava-wordmark {
        font-family: 'Cinzel', 'Playfair Display', 'Times New Roman', Georgia, serif;
        font-weight: 700;
        fill: #2c1208;
        letter-spacing: 0.14em;
      }
    </style>
  </defs>

  <!-- Left Symbol: Astronava Compass & Orbits -->
  <g transform="translate(10, 5)">
    <!-- Tilted orbit -->
    <ellipse cx="65" cy="65" rx="52" ry="26" transform="rotate(-30 65 65)" stroke="#c2410c" stroke-width="2.2" fill="none" opacity="0.8" />
    <!-- Partial outer arc -->
    <path d="M 68 16 A 48 48 0 0 1 114 74" stroke="#c2410c" stroke-width="2.4" fill="none" stroke-linecap="round" />
    <!-- Orbit planetary nodes -->
    <circle cx="110" cy="45" r="3.6" fill="#c2410c" />
    <circle cx="106" cy="92" r="3" fill="#c2410c" />
    <circle cx="22" cy="78" r="2.2" fill="#c2410c" opacity="0.85" />

    <!-- 4-Point Celestial Navigation Star -->
    <path d="
      M 65 8
      C 65 42 42 65 8 65
      C 42 65 65 88 65 122
      C 65 88 88 65 122 65
      C 88 65 65 42 65 8 Z
    " fill="url(#astroFullStarGrad)" stroke="#7c2d12" stroke-width="1.2" />

    <!-- Core Navigational Orb -->
    <circle cx="65" cy="65" r="9" fill="url(#astroFullCoreGrad)" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="62.5" cy="62.5" r="2.2" fill="#ffffff" opacity="0.85" />
  </g>

  <!-- Right: Wordmark ASTRONAVA -->
  <g transform="translate(156, 92)">
    <!-- ASTR -->
    <text class="astronava-wordmark" font-size="58" x="0" y="0">ASTR</text>

    <!-- Custom 'O' with centered 4-point golden star -->
    <g transform="translate(202, -22)">
      <!-- Outer O ellipse ring -->
      <ellipse cx="20" cy="2" rx="19" ry="24" fill="none" stroke="#2c1208" stroke-width="9" />
      <!-- Star inside O -->
      <path d="
        M 20 -10
        C 20 -4 16 2 8 2
        C 16 2 20 8 20 14
        C 20 8 24 2 32 2
        C 24 2 20 -4 20 -10 Z
      " fill="url(#goldStarInOGrad)" />
    </g>

    <!-- NAVA -->
    <text class="astronava-wordmark" font-size="58" x="250" y="0">NAVA</text>
  </g>
</svg>
